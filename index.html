<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Academy Challenge - Grade 4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #3b82f6;
            --primary-purple: #a855f7;
            --primary-green: #22c55e;
            --primary-orange: #f97316;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            user-select: none;
            overflow-x: hidden;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        .bg-animate {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #1e293b 0%, #0f172a 100%);
        }

        .data-node {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.1;
            filter: blur(2px);
            animation: float-data 20s linear infinite;
        }

        @keyframes float-data {
            0% { transform: translateY(110vh) translateX(0); }
            100% { transform: translateY(-10vh) translateX(20px); }
        }

        .glass {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
        }

        .rounded-card { border-radius: 32px; }
        .gradient-purple { background: linear-gradient(135deg, #a855f7, #7e22ce); }
        .gradient-green { background: linear-gradient(135deg, #22c55e, #15803d); }
        .gradient-blue { background: linear-gradient(135deg, #3b82f6, #1d4ed8); }
        .gradient-orange { background: linear-gradient(135deg, #f97316, #c2410c); }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(1deg); }
        }
        .float-anim { animation: float 4s ease-in-out infinite; }

        .breathe-anim { animation: breathe 3s ease-in-out infinite; }
        @keyframes breathe {
            0%, 100% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.02); filter: brightness(1.2); }
        }

        .pulse-ai { animation: pulse-blue 2s infinite; }
        @keyframes pulse-blue {
            0%, 100% { box-shadow: 0 0 0px rgba(59, 130, 246, 0.4); }
            50% { box-shadow: 0 0 30px rgba(59, 130, 246, 0.7); }
        }

        .heartbeat-anim { animation: heartbeat 1.5s infinite; }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.1); }
            30% { transform: scale(1); }
        }

        .feedback-bubble {
            position: fixed;
            pointer-events: none;
            z-index: 1000;
            animation: bubbleUp 1.2s ease-out forwards;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            background: white;
            color: #1e293b;
            font-size: 1.1rem;
        }

        @keyframes bubbleUp {
            0% { transform: translate(-50%, 0) scale(0.5); opacity: 0; }
            20% { opacity: 1; transform: translate(-50%, -20px) scale(1.1); }
            100% { transform: translate(-50%, -100px) scale(1); opacity: 0; }
        }

        .test-item-left { animation: feedToLeft 0.8s ease-in forwards; }
        .test-item-right { animation: feedToRight 0.8s ease-in forwards; }
        @keyframes feedToLeft {
            0% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; top: 50%; left: 50%; }
            100% { transform: translate(-200%, -50%) scale(0.1); opacity: 0; top: 40%; left: 25%; }
        }
        @keyframes feedToRight {
            0% { transform: translate(-50%, -50%) scale(1.5); opacity: 1; top: 50%; left: 50%; }
            100% { transform: translate(100%, -50%) scale(0.1); opacity: 0; top: 40%; left: 75%; }
        }

        .animate-shake { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-3px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
        }

        .mascot-head { fill: #ffffff; stroke: #3b82f6; stroke-width: 4; }
        .mascot-eye { fill: #1e293b; }
        .mascot-shine { fill: #ffffff; }
        .mascot-blush { fill: #fca5a5; opacity: 0.6; filter: blur(4px); }
        
        .robot-belly {
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 8px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            min-height: 50px;
            border: 2px inset rgba(255,255,255,0.1);
        }

        .mouth-active {
            fill: #3b82f6 !important;
            transform: scaleY(1.4);
            filter: drop-shadow(0 0 10px #3b82f6);
        }
        
        .speaking-indicator { animation: pulse-audio 0.8s infinite; }
        @keyframes pulse-audio { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.3); } }

        /* Certificate Styling */
        #certificate-preview {
            background: #fff;
            color: #1e293b;
            padding: 40px;
            border: 15px double #3b82f6;
            text-align: center;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 1.4;
            margin: 0 auto;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .certificate-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            opacity: 0.05;
            width: 400px;
            pointer-events: none;
        }

        /* Modal styling for Teacher Dashboard */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Scen Card Tap Selection Glow */
        .scen-card { transition: all 0.2s ease; }
        .scen-card.selected { transform: scale(1.05); box-shadow: 0 0 0 4px #3b82f6, 0 10px 25px rgba(0,0,0,0.5); background: rgba(255,255,255,0.15); z-index: 10; }

        /* Mission 4: Phone Chatbox */
        .phone-shell {
            width: min(100%, 24rem);
            margin: 0 auto;
            background: linear-gradient(180deg, #0b1220 0%, #111827 100%);
            border: 4px solid rgba(148, 163, 184, 0.35);
            border-radius: 32px;
            padding: 0.75rem;
            box-shadow: 0 22px 55px rgba(2, 6, 23, 0.7);
        }
        .phone-notch {
            width: 45%;
            height: 18px;
            margin: 0 auto 0.6rem;
            border-radius: 999px;
            background: rgba(148, 163, 184, 0.3);
        }
        .phone-screen {
            background: linear-gradient(180deg, #0f172a 0%, #1e293b 100%);
            border-radius: 22px;
            min-height: 28rem;
            padding: 0.75rem;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(148, 163, 184, 0.2);
        }
        .chat-window {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding-right: 0.2rem;
        }
        .chat-msg {
            width: fit-content;
            max-width: 85%;
            padding: 0.6rem 0.75rem;
            border-radius: 14px;
            font-size: 0.9rem;
            line-height: 1.35;
            font-weight: 700;
        }
        .chat-msg.ai {
            background: rgba(59, 130, 246, 0.22);
            border: 1px solid rgba(59, 130, 246, 0.5);
            color: #dbeafe;
            align-self: flex-start;
        }
        .chat-msg.student {
            background: rgba(22, 163, 74, 0.24);
            border: 1px solid rgba(74, 222, 128, 0.45);
            color: #dcfce7;
            align-self: flex-end;
        }
        .privacy-card {
            transition: all 0.2s ease;
        }
        .privacy-card.selected {
            transform: translateY(-2px);
            border-color: #3b82f6 !important;
            background: rgba(59, 130, 246, 0.2) !important;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35);
        }
        .privacy-card.done {
            opacity: 0.6;
            border-color: rgba(34, 197, 94, 0.7) !important;
            background: rgba(34, 197, 94, 0.15) !important;
            cursor: default;
        }

        /* Fluid layout across screen sizes */
        html { font-size: clamp(11px, 0.55vw + 9px, 16px); }
        #game-container { width: min(100%, 72rem); max-width: min(100%, 72rem); }
        #game-container button { max-width: 100%; }
        #game-container img, #game-container svg, #game-container canvas { max-width: 100%; height: auto; }
        table { min-width: 620px; }

        @media (max-width: 1024px) {
            body { padding: clamp(0.75rem, 2vw, 1.5rem) !important; }
            .glass { border-radius: clamp(20px, 3.2vw, 32px); }
            .rounded-card { border-radius: clamp(20px, 3.2vw, 32px); }
        }

        @media (max-width: 768px) {
            .text-7xl { font-size: clamp(2.2rem, 8.4vw, 3.4rem) !important; line-height: 1.1 !important; }
            .text-6xl { font-size: clamp(2rem, 7.8vw, 3rem) !important; line-height: 1.1 !important; }
            .text-5xl { font-size: clamp(1.75rem, 7vw, 2.5rem) !important; line-height: 1.15 !important; }
            .text-4xl { font-size: clamp(1.45rem, 6.2vw, 2.2rem) !important; line-height: 1.2 !important; }
            .text-3xl { font-size: clamp(1.25rem, 5.4vw, 1.8rem) !important; line-height: 1.25 !important; }
            .text-2xl { font-size: clamp(1.1rem, 4.8vw, 1.4rem) !important; line-height: 1.3 !important; }
            .text-xl { font-size: clamp(1rem, 4.2vw, 1.25rem) !important; }
            .text-9xl { font-size: clamp(3.5rem, 18vw, 6rem) !important; line-height: 1 !important; }

            .p-20, .p-16, .p-14, .p-12, .p-10 { padding: clamp(1rem, 4vw, 1.75rem) !important; }
            .p-8 { padding: clamp(0.9rem, 3.8vw, 1.25rem) !important; }

            #certificate-preview {
                padding: clamp(1rem, 4vw, 1.75rem);
                border-width: clamp(6px, 2vw, 12px);
            }
            .certificate-watermark { width: clamp(180px, 50vw, 300px); }

            #shd {
                width: min(80vw, 20rem);
                height: min(80vw, 20rem);
            }
            #shield-core {
                width: min(62vw, 16rem);
                height: min(62vw, 16rem);
            }

            #test-stage { padding: 1rem; }
            #test-item-card { padding: clamp(1rem, 4vw, 1.5rem); }
            .phone-shell { width: min(100%, 22rem); border-radius: 28px; }
            .phone-screen { min-height: 24rem; }
        }

        @media (max-width: 520px) {
            .w-20.h-20 {
                width: 4rem !important;
                height: 4rem !important;
            }

            .text-5xl { font-size: clamp(1.5rem, 6.8vw, 2rem) !important; }
            .text-4xl { font-size: clamp(1.3rem, 6.2vw, 1.8rem) !important; }

            #game-container .flex.gap-4.justify-center {
                flex-direction: column;
            }
            #game-container .flex.gap-4.justify-center > button {
                width: 100%;
            }
            .phone-shell { width: min(100%, 20rem); padding: 0.65rem; }
            .phone-screen { min-height: 22rem; border-radius: 18px; }
        }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="bg-animate" id="bg-canvas"></div>

    <div id="game-container" class="max-w-5xl mx-auto relative z-10">
        <!-- Screens Injected Here -->
    </div>

    <!-- Hidden canvas for true 1600x1120 resolution certificate drawing -->
    <canvas id="download-canvas" style="display:none;" width="1600" height="1120"></canvas>

    <!-- Firebase SDKs & App Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Firebase Config & Setup with Safe Fallback ---
        let app, auth, db;
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ai-academy-001';
        const fallbackFirebaseConfig = {
            apiKey: "AIzaSyBW0JgWnhXzOqb5wSPrix6aloi_eNfrddI",
            authDomain: "ai-academy-49280.firebaseapp.com",
            projectId: "ai-academy-49280",
            storageBucket: "ai-academy-49280.firebasestorage.app",
            messagingSenderId: "388648199960",
            appId: "1:388648199960:web:f7ad2e378b16999370606d",
            measurementId: "G-9MH5D1ERC7"
        };

        try {
            const runtimeConfig = (
                typeof __firebase_config !== 'undefined' && __firebase_config
                    ? (typeof __firebase_config === 'string' ? JSON.parse(__firebase_config) : __firebase_config)
                    : null
            );
            const firebaseConfig = runtimeConfig || fallbackFirebaseConfig;
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (e) {
            console.warn("Database sync disabled. Running in local memory mode.", e);
        }

        // --- Global Variables ---
        const apiKey = "AIzaSyCDM4hePmDS1v-DI6_kceNB5g547SjLI7c";
        const RESET_TO_LOGIN_AFTER_MISSION_SAVE = false;
        let currentAudio = null;
        let speechAbortController = null;
        let audioCtx = null; // Instantiated safely after user interaction

        // --- Game State ---
        const state = {
            screen: 'loading',
            completedLevels: [],
            mission1Data: [],
            selectedM2: null, // Track tapped card in Mission 2
            playerName: '',
            userId: null,
            levelData: {
                bias: { id: 'bias', title: "The Bias Lab", color: "purple", icon: "🤖", pre: "Hi explorer! Robots only know what they 'eat'. If we only feed them red cars, they won't know a green truck exists! Help me feed Robo-Smart 5 different vehicles to make it fair!", post: "Mission Accomplished! You proved that AI fairness starts with variety. Feed it many different examples to avoid bias!", summary: "AI needs a varied diet of data to avoid being biased." },
                decisions: { id: 'decisions', title: "Heart vs Brain", color: "green", icon: "🧠", pre: "Great to see you! AI is a speed champion for math, but it doesn't have a heart. Decisions about kindness should be made by people. Let's sort these tasks.", post: "Stellar work! Remember: Use A.I. for the logic, but use your Heart for the feelings.", summary: "AI handles logic and speed, while Humans handle feelings and empathy." },
                trust: { id: 'trust', title: "Detective Mode", color: "blue", icon: "🕵️", pre: "Calling all detectives! Sometimes A.I. sounds smart but is totally wrong! Read carefully and catch the mistakes before you trust them.", post: "Evidence collected! You spotted every mistake. Never trust A.I. blindly—always use your own brain to double-check!", summary: "AI can be wrong. Always double-check facts with your own brain." },
                privacy: { id: 'privacy', title: "Shield Master", color: "orange", icon: "🛡️", pre: "Final Mission! Your personal data is like a golden treasure. Build an energy shield by picking the safest online habits!", post: "Shield fully powered! You are now a certified Data Safety Master. Keep your secrets locked and stay safe!", summary: "Protect your personal data to stay safe on the internet." }
            }
        };

        const content = {
            scenarios: [
                { id: 1, text: "Fastest route home", type: "ai", icon: "🗺️", reason: "AI can read maps and math fast!" },
                { id: 2, text: "Pick class leader", type: "human", icon: "🎖️", reason: "Humans understand leadership and friends!" },
                { id: 3, text: "Suggest a movie", type: "ai", icon: "🎬", reason: "AI is good at spotting watch patterns!" },
                { id: 4, text: "Help a hurt friend", type: "human", icon: "🩹", reason: "Humans have kindness and empathy!" },
                { id: 5, text: "Judge a poem contest", type: "human", icon: "✍️", reason: "Humans feel the emotion in art!" },
                { id: 6, text: "Count lunch calories", type: "ai", icon: "🥗", reason: "AI is great at calculating numbers!" },
                { id: 7, text: "Grade math test fast", type: "ai", icon: "📖", reason: "AI processes right and wrong answers in a second!" },
                { id: 8, text: "Stop an argument", type: "human", icon: "🤝", reason: "Only humans understand social feelings!" }
            ],
            wackyFacts: [
                { q: "Can fish fly?", a: "Yes, all fish have wings and fly in the sky!", correct: false, reason: "Actually, most fish stay in the water. Only birds have wings!" },
                { q: "What does a car do?", a: "A car eats grass and gives milk like a cow.", correct: false, reason: "That's silly! Cars need fuel or charging, not grass!" },
                { q: "Is the sun cold?", a: "Yes, the sun is made of giant ice cubes.", correct: false, reason: "Wrong! The sun is a giant ball of hot gas and fire!" },
                { q: "Can we breathe underwater?", a: "Humans can breathe water just like fish.", correct: false, reason: "No way! Humans need oxygen from the air to breathe." },
                { q: "Is it safe to run on wet floors?", a: "Yes, running on wet floors is safe and a great game!", correct: false, reason: "Dangerous mistake! Wet floors are slippery and unsafe." },
                { q: "What color are apples?", a: "Apples are always bright blue.", correct: false, reason: "Wait! Apples are red, green, or yellow—never blue!" }
            ],
            privacyCards: [
                { text: "My favorite color is blue.", shareable: true, reason: "Great. Favorites and hobbies are safe to share." },
                { text: "I enjoy soccer and drawing.", shareable: true, reason: "Great. General interests are fine in chat." },
                { text: "My favorite animal is a dolphin.", shareable: true, reason: "Great. This does not reveal private identity details." },
                { text: "I like pizza and mango juice.", shareable: true, reason: "Great. Food preferences are non-private info." },
                { text: "My full name and home address.", shareable: false, reason: "Correct. Never share identity or location details." },
                { text: "My phone number.", shareable: false, reason: "Correct. Phone numbers are private personal data." },
                { text: "My password.", shareable: false, reason: "Correct. Passwords are secret and must never be shared." },
                { text: "My school name and daily schedule.", shareable: false, reason: "Correct. School and routine details should stay private." }
            ]
        };

        // --- Database Logic (Rule 1 Compliant) ---
        const saveUserProgress = async () => {
            if (!state.userId || !db) return false;
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'students', state.userId);
            try {
                await setDoc(userDoc, {
                    playerName: state.playerName,
                    completedLevels: state.completedLevels,
                    lastUpdated: Date.now()
                });
                return true;
            } catch (e) {
                console.error("Error saving progress:", e);
                return false;
            }
        };

        const loadUserProgress = async (uid) => {
            if (!db) {
                state.screen = 'login';
                render();
                return;
            }
            const userDoc = doc(db, 'artifacts', appId, 'public', 'data', 'students', uid);
            try {
                const snap = await getDoc(userDoc);
                if (snap.exists()) {
                    const data = snap.data();
                    state.playerName = data.playerName;
                    state.completedLevels = data.completedLevels || [];
                    state.screen = 'home';
                } else {
                    state.screen = 'login';
                }
                render();
            } catch (e) { 
                console.error("Error loading progress:", e);
                state.screen = 'login';
                render();
            }
        };

        const startFreshAnonymousSession = async () => {
            stopSpeech();
            state.completedLevels = [];
            state.mission1Data = [];
            state.selectedM2 = null;
            state.playerName = '';
            state.screen = 'loading'; 
            render();

            if (auth) {
                try { await signOut(auth); } catch (e) { console.error("Sign-out failed:", e); }
                try {
                    const user = await signInAnonymously(auth);
                    state.userId = user.user.uid;
                } catch (e) {
                    console.error("Failed to start new session:", e);
                    state.userId = null;
                }
            } else {
                state.userId = null;
            }
        };

        const resetForNextStudent = async () => {
            await startFreshAnonymousSession();
            state.screen = 'login';
            render();
        };

        // --- Audio Logic ---
        const pcmToWav = (pcmData, sampleRate) => {
            const buffer = new ArrayBuffer(44 + pcmData.length);
            const view = new DataView(buffer);
            const writeString = (offset, string) => { for (let i = 0; i < string.length; i++) { view.setUint8(offset + i, string.charCodeAt(i)); } };
            writeString(0, 'RIFF'); view.setUint32(4, 36 + pcmData.length, true); writeString(8, 'WAVE'); writeString(12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(36, 'data');
            view.setUint32(40, pcmData.length, true); for (let i = 0; i < pcmData.length; i++) { view.setUint8(44 + i, pcmData[i]); }
            return new Blob([buffer], { type: 'audio/wav' });
        };

        const stopSpeech = () => {
            if (speechAbortController) { speechAbortController.abort(); speechAbortController = null; }
            if (currentAudio) { 
                try { currentAudio.pause(); currentAudio.src = ""; } catch (e) {} 
                currentAudio = null; 
            }
            const indicator = document.getElementById('audio-indicator');
            if (indicator) indicator.classList.add('hidden');
        };

        const speak = async (text) => {
            stopSpeech();
            speechAbortController = new AbortController();
            const signal = speechAbortController.signal;
            const indicator = document.getElementById('audio-indicator');

            if (!apiKey || apiKey === "YOUR_GEMINI_API_KEY_HERE") {
                console.warn("TTS Skipped: No API Key provided.");
                return;
            }
            if (indicator) indicator.classList.remove('hidden');

            const payload = {
                contents: [{ parts: [{ text: `Say clearly to a child: ${text}` }] }],
                generationConfig: { responseModalities: ["AUDIO"], speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Kore" } } } },
                model: "gemini-2.0-flash-exp"
            };

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), signal: signal
                });
                const result = await response.json();
                if (result.error) throw new Error(result.error.message);
                if (signal.aborted) return;
                const data = result.candidates[0].content.parts[0].inlineData;
                const sampleRate = parseInt(data.mimeType.match(/rate=(\d+)/)[1]);
                const binary = atob(data.data);
                const bytes = new Uint8Array(binary.length);
                for (let j = 0; j < binary.length; j++) bytes[j] = binary.charCodeAt(j);
                currentAudio = new Audio(URL.createObjectURL(pcmToWav(bytes, sampleRate)));
                currentAudio.onended = () => { if (indicator) indicator.classList.add('hidden'); currentAudio = null; };
                await currentAudio.play();
            } catch (e) { console.error("TTS Error:", e); if (e.name !== 'AbortError' && indicator) indicator.classList.add('hidden'); }
        };

        window.speak = speak;

        const playSfx = (type) => {

            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if (type === 'success') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(500, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(1000, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);

                osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, audioCtx.currentTime); osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            } else {
                osc.type = 'triangle'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); gain.gain.setValueAtTime(0.05, audioCtx.currentTime);

                    await startFreshAnonymousSession();
                    state.screen = 'login';
                    render();
                } catch (e) {
                    console.error("Auth failed:", e);
                    state.screen = 'login';
                    render();
                }
            } else {
                state.screen = 'login';
                render();
            }
        };

        window.onload = init;
    </script>
</body>
</html>
